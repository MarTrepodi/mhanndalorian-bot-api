name: Python Package Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Read-only: tagging moved to its own job, gated behind a successful publish.
      contents: read

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # Install uv (the project is uv-managed; requirements.txt no longer exists)
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Install project dependencies via uv
      - name: Install dependencies
        run: |
          uv sync --frozen
          uv tool install hatch
          uv tool install git-changelog

      # Build the package.
      # `uv build` rather than `python -m build`: uv-created virtualenvs do not ship pip, so
      # `uv run python -m pip install ...` fails with "No module named pip" and the release
      # never reaches the tag step. uv builds the sdist and wheel into dist/ natively.
      - name: Build the package
        run: uv build

      # Upload built distributions so the pypi-publish job can fetch them
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Update CHANGELOG.md
      - name: Update CHANGELOG.md
        run: |
          uv tool run git-changelog -B auto -Tio CHANGELOG.md -c angular -s build,deps,fix,feat,refactor -n semver

  # Publish the package to PyPI
  pypi-publish:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write

    environment:
      name: pypi-release
      url: https://pypi.org/project/mhanndalorian-bot/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

  # Tag only once the publish has succeeded.
  #
  # This was a step inside `release`, running before the artifact was even uploaded and long
  # before PyPI saw anything -- so a failure in any later step left a tag behind for a release
  # that never happened. That is exactly what befell v0.11.0: the tag was pushed, the next step
  # failed, and the `tag-release` ruleset forbids deleting tags, so it could not be undone. A
  # tag now means the release completed.
  tag:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - release
      - pypi-publish
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tag the release
        run: |
          VERSION=$(uvx hatch version)
          # Idempotent: v0.11.0 already exists from the run that failed mid-release, and the
          # `tag-release` ruleset forbids deleting a tag to clear the way.
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin; leaving it as is."
          else
            git config user.name "$(git log -n 1 --pretty=format:%an)"
            git config user.email "$(git log -n 1 --pretty=format:%ae)"
            git tag -a "v$VERSION" -m "Release version $VERSION"
            git push origin "v$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
