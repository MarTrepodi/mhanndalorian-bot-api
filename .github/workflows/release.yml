name: Python Package Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  # Decide whether this version needs releasing at all.
  #
  # `release.yml` fires on every merged PR into main, not on version changes -- so a promotion
  # that carries a CI fix or a docs change re-runs the whole release for a version already on
  # PyPI, and the publish fails on a duplicate. This job answers the question once, up front,
  # and the rest of the workflow is gated on it.
  #
  # Deliberately fails on anything other than a clean 200 or 404. A silently-skipped publish
  # would mask a real problem -- PyPI being unreachable must not look like "already released".
  check:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.probe.outputs.version }}
      should_release: ${{ steps.probe.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Is this version already on PyPI?
        id: probe
        run: |
          # Read the distribution name from pyproject rather than hard-coding it, so a rename
          # cannot silently turn the guard into a no-op that always says "not released".
          PKG=$(grep -m1 '^name = ' pyproject.toml | cut -d'"' -f2)
          VERSION=$(uvx hatch version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
                   "https://pypi.org/pypi/$PKG/$VERSION/json")
          case "$CODE" in
            404)
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$PKG $VERSION is not on PyPI; proceeding with the release."
              ;;
            200)
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$PKG $VERSION is already on PyPI. Nothing to release; bump the version to cut a new one."
              ;;
            *)
              echo "::error::Unexpected HTTP $CODE from PyPI for $PKG $VERSION. Refusing to guess whether this version is published."
              exit 1
              ;;
          esac

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Read-only: tagging moved to its own job, gated behind a successful publish.
      contents: read

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # Install uv (the project is uv-managed; requirements.txt no longer exists)
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Install project dependencies via uv
      - name: Install dependencies
        run: |
          uv sync --frozen
          uv tool install hatch
          uv tool install git-changelog

      # Build the package.
      # `uv build` rather than `python -m build`: uv-created virtualenvs do not ship pip, so
      # `uv run python -m pip install ...` fails with "No module named pip" and the release
      # never reaches the tag step. uv builds the sdist and wheel into dist/ natively.
      - name: Build the package
        run: uv build

      # Upload built distributions so the pypi-publish job can fetch them
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Update CHANGELOG.md
      - name: Update CHANGELOG.md
        run: |
          uv tool run git-changelog -B auto -Tio CHANGELOG.md -c angular -s build,deps,fix,feat,refactor -n semver

  # Publish the package to PyPI
  pypi-publish:
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - check
      - release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write

    environment:
      name: pypi-release
      url: https://pypi.org/project/mhanndalorian-bot/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  # Tag only once the publish has succeeded.
  #
  # This was a step inside `release`, running before the artifact was even uploaded and long
  # before PyPI saw anything -- so a failure in any later step left a tag behind for a release
  # that never happened. That is exactly what befell v0.11.0: the tag was pushed, the next step
  # failed, and the `tag-release` ruleset forbids deleting tags, so it could not be undone. A
  # tag now means the release completed.
  tag:
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - check
      - release
      - pypi-publish
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tag the release
        run: |
          VERSION=$(uvx hatch version)
          # Idempotent: v0.11.0 already exists from the run that failed mid-release, and the
          # `tag-release` ruleset forbids deleting a tag to clear the way.
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin; leaving it as is."
          else
            git config user.name "$(git log -n 1 --pretty=format:%an)"
            git config user.email "$(git log -n 1 --pretty=format:%ae)"
            git tag -a "v$VERSION" -m "Release version $VERSION"
            git push origin "v$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish a GitHub Release for the tag.
      #
      # The workflow has never done this: it pushed a tag and stopped, and a git tag is not a
      # GitHub Release. v0.7.0-v0.10.0 have Releases because an earlier semantic-release setup
      # made them; `upload_to_release = false` in pyproject.toml is inert, since this workflow
      # never invokes semantic-release. v0.11.0's Release had to be created by hand.
      #
      # Notes come from the hand-written CHANGELOG section for this version rather than
      # --generate-notes, which would list raw commit subjects and bury the breaking changes.
      - name: Create the GitHub Release
        run: |
          VERSION=$(uvx hatch version)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it as is."
            exit 0
          fi
          # Slice this version's section out of CHANGELOG.md: from its heading to the next one.
          # Literal string match, not a regex: awk -v processes escapes, so a bracketed
          # pattern like "## \[v1.2.3\]" arrives as "## [v1.2.3]" and is read as a
          # character class, matching nothing.
          awk -v head="## [v$VERSION]" '
            index($0, head) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section for v$VERSION; falling back to generated notes."
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
